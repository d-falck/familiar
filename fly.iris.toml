app = "iris-familiar"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HISTORY_DB_PATH = "/data/history.sqlite"
  MEMORY_PATH = "/data/memory.md"
  PERSONA_PATH = "prompts/assistant.md"
  AGENT_BACKEND = "codex"
  ANTHROPIC_MODEL = "claude-opus-4-8[1m]"
  CODEX_MODEL = "gpt-5.6-sol"
  # Codex won't create helper binaries under /tmp, so keep its home on the volume.
  CODEX_HOME_BASE = "/data"
  MAX_AGENT_TURNS = "40"
  CLAUDE_ENABLE_STREAM_WATCHDOG = "1"
  MAX_MCP_OUTPUT_TOKENS = "25000"
  ATTACHMENTS_DIR = "/data/attachments"
  SCHEDULE_INTERVAL_SECONDS = "3600"
  TIMEZONE = "Europe/London"
  # Hour (local TZ) of the once-daily minimal triage nudge. All other hourly
  # ticks are travel/deadline-only. See _run_scheduler in src/bot.py.
  TRIAGE_HOUR = "8"
  PORT = "8080"
  # Self-improvement: a checkout of her own repo on the volume, plus the
  # command she runs to deploy herself. Needs GITHUB_TOKEN + FLY_API_TOKEN
  # secrets. Unset on flat-hunt-bot, so that bot can't self-modify.
  SELF_REPO_DIR = "/data/familiar"
  SELF_REPO_URL = "https://github.com/d-falck/familiar.git"
  SELF_DEPLOY_CMD = "flyctl deploy -c fly.iris.toml -a iris-familiar --ha=false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

[deploy]
  strategy = "immediate"
