# Read-only diagnostics for the running bot. Manual trigger only; it never
# deploys, restarts or changes anything.
#
# Exists because the bot can be silent while healthy: the HTTP health route
# answers from the same process that polls Telegram, so "health is ok" does
# not prove updates are being received or turns are completing.
#
# Log output is filtered on purpose. Message bodies and model replies are
# logged at INFO and are private, so only levels, counts and failure lines
# are printed here, never conversation content.

name: Diagnose Iris

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "How many filtered failure lines to show"
        required: false
        default: "150"

jobs:
  diagnose:
    name: Status and filtered logs
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: App and machine status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::status"
          flyctl status -a iris-familiar || true
          echo "::endgroup::"
          echo "::group::machines (more than one means two pollers fight over Telegram)"
          flyctl machines list -a iris-familiar || true
          echo "::endgroup::"

      - name: Filtered logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          LINES: ${{ inputs.lines }}
        run: |
          flyctl logs --no-tail -a iris-familiar > logs.txt 2>&1 || true
          echo "captured $(wc -l < logs.txt) log lines"

          echo "::group::log level counts"
          grep -oE '\b(DEBUG|INFO|WARNING|ERROR|CRITICAL)\b' logs.txt \
            | sort | uniq -c | sort -rn || true
          echo "::endgroup::"

          # Allowlist, never a denylist: only log messages whose format
          # strings interpolate no user or model text are printed. Her INFO
          # lines otherwise carry message bodies, replies and usernames, and
          # CI output is the wrong place for any of it. Anything not named
          # here stays unprinted even if it would have been useful.
          SAFE='telegram long-polling started|http /health listening|composio webhook listening|scheduler running|voice-init shared-context|agent backend=|applying persisted model override|model switched|duplicate update_id=|interrupting in-flight turn|turn superseded|trimmed transcript|fast-path turn|respond failed|scheduled check-in failed|failed to set reaction|failed to persist|markdown send failed|MarkdownV2 rejected|plain-text send failed|markdownify failed|sanitized provider stream error|model usage limit returned as reply text|photo download failed|voice download failed|document download failed|voice transcription failed|did not accept the|produced no output for|Machine started|Starting init|Main child exited|OOM|out of memory'

          echo "::group::turn-loop activity (allowlisted messages only)"
          grep -inE "$SAFE" logs.txt | cut -c1-200 | tail -"${LINES:-150}" || true
          echo "::endgroup::"

          echo "::group::most frequent allowlisted messages"
          grep -ioE "$SAFE" logs.txt | sort | uniq -c | sort -rn | head -25 || true
          echo "::endgroup::"

          echo "::group::log window span"
          head -1 logs.txt | cut -c1-30 || true
          tail -1 logs.txt | cut -c1-30 || true
          echo "::endgroup::"

