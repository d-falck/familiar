app = "iris-finance-readonly"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.finance"

[env]
  PORT = "8080"
  EMMA_EXPORT_XLSX_PATH = "/data/emma-history-2026.xlsx"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "finance_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
